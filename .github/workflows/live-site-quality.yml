name: Live site quality

on:
  workflow_run:
    workflows: ["Browser quality"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: live-site-quality-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    name: Verify live deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the exact tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Wait for and verify GitHub Pages deployment
        run: >-
          python scripts/verify_live_deployment.py
          --root "$GITHUB_WORKSPACE"
          --base-url "https://withnati.github.io/free-htl-guide-site/"
          --head-sha "${{ github.event.workflow_run.head_sha }}"
          --attempts 20
          --delay 30
