name: Browser quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: npm

      - name: Install locked test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Chromium and operating-system dependencies
        run: npx playwright install chromium --with-deps

      - name: Run desktop and mobile browser tests
        run: npm run test:browser

      - name: Upload browser report and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: browser-quality-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
