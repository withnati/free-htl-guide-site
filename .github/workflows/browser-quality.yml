name: Browser quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: npm

      - name: Install locked test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Chromium and operating-system dependencies
        run: npx playwright install chromium --with-deps

      - name: Run development-source desktop and mobile tests
        run: npm run test:browser

      - name: Build allowlisted public deployment
        env:
          FHL_ENVIRONMENT: preview
          FHL_PUBLIC_SITE_URL: http://127.0.0.1:4174/
        run: npm run build:public

      - name: Validate generated public deployment
        run: npm run validate:public-build

      - name: Run generated public deployment desktop and mobile tests
        run: npm run test:public-build-browser

      - name: Run live staging desktop and mobile smoke tests
        if: ${{ vars.FHL_STAGING_BASE_URL != '' || github.head_ref == 'layer-14-5-exam-positioning-copy' }}
        env:
          FHL_STAGING_BASE_URL: ${{ vars.FHL_STAGING_BASE_URL != '' && vars.FHL_STAGING_BASE_URL || 'https://layer-14-5-exam-positioning.fhl-guide-staging.pages.dev' }}
        run: npx playwright test --config=playwright.staging.config.cjs

      - name: Report staging review gate
        if: ${{ vars.FHL_STAGING_BASE_URL == '' && github.head_ref != 'layer-14-5-exam-positioning-copy' }}
        run: echo "::notice::Live staging tests were not run because the FHL_STAGING_BASE_URL repository variable is not configured. Provider deployment and manual staging review remain required before merge."

      - name: Upload browser reports and failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: browser-quality-report
          path: |
            playwright-report/
            test-results/
            playwright-public-report/
            test-results-public/
            playwright-staging-report/
            dist/build-manifest.json
          if-no-files-found: ignore
          retention-days: 14
