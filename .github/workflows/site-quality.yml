name: Site quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Test the site validator
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate HTML, links, assets, sitemap, and robots
        run: python scripts/validate_site.py --root "$GITHUB_WORKSPACE"

      - name: Validate authority metadata and quiz integrity
        run: python scripts/validate_authority.py --root "$GITHUB_WORKSPACE"

      - name: Validate mock exam blueprint and runtime
        run: python scripts/validate_mock_exam.py --root "$GITHUB_WORKSPACE"

      - name: Validate search, sharing, and manifest metadata
        run: python scripts/validate_seo.py --root "$GITHUB_WORKSPACE"

      - name: Validate privacy-first analytics contract
        run: python scripts/validate_analytics.py --root "$GITHUB_WORKSPACE"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          checked=0
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
            checked=$((checked + 1))
          done < <(find . -type f -name '*.js' -not -path './.git/*' -not -path './node_modules/*' -print0)
          echo "Checked $checked JavaScript file(s)."
