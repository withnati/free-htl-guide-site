name: Database quality

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/**"
      - "scripts/validate_cloud_progress.py"
      - "scripts/subscription_state.py"
      - "tests/test_cloud_progress.py"
      - "tests/test_subscription_state.py"
      - ".github/workflows/database-quality.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - "scripts/validate_cloud_progress.py"
      - "scripts/subscription_state.py"
      - "tests/test_cloud_progress.py"
      - "tests/test_subscription_state.py"
      - ".github/workflows/database-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Supabase schema and RLS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run subscription lifecycle tests
        run: python -m unittest tests.test_subscription_state

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.84.2
          github-token: ${{ github.token }}

      - name: Initialize local Supabase configuration
        run: supabase init --force

      - name: Start fresh local database and apply migrations
        run: supabase db start

      - name: Lint database functions and schema
        run: supabase db lint --level warning --fail-on error

      - name: Run database ownership tests
        run: supabase test db

      - name: Stop local database
        if: always()
        run: supabase stop --no-backup
